<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Broken Authentication / Weak Password Storage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
        }

        h1, h2, h3 {
            color: #1f3b73;
        }

        nav {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #ddd;
        }

        nav a {
            margin-right: 12px;
            text-decoration: none;
            color: #0d6efd;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .error {
            color: #b00020;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .success {
            color: #198754;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            background: #fafafa;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            max-width: 350px;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #0d6efd;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffe69c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .safe {
            background: #d1e7dd;
            border: 1px solid #badbcc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="{% url 'home' %}">Начало</a>
            <a href="{% url 'vulnerable_register' %}">Уязвима регистрация</a>
            <a href="{% url 'vulnerable_login' %}">Уязвим вход</a>
            <a href="{% url 'vulnerable_users_list' %}">Уязвими потребители</a>
            <a href="{% url 'safe_register' %}">Защитена регистрация</a>
            <a href="{% url 'safe_login' %}">Защитен вход</a>
            <a href="{% url 'safe_users_list' %}">Защитени потребители</a>
        </nav>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
